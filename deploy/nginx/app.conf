# 80번은 인증서 갱신 확인만 받고 나머지는 HTTPS 로 보낸다.
server {
    listen 80;
    server_name gooddeedquest.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gooddeedquest.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/gooddeedquest.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gooddeedquest.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 인증 사진·영상 업로드가 지나갈 수 있어 기본값(1MB)으로는 부족하다.
    client_max_body_size 50m;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 추천이 실측 20~40초다. nginx 기본 60초로는 재시도가 붙을 때 끊긴다.
        # 이걸 안 늘리면 추천 요청이 504 Gateway Timeout 으로 죽는다.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
