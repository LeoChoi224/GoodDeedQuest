# EC2 배포용. 로컬과 달리 postgres 서비스가 없다 (RDS 사용).
# 이미지는 여기서 만들지 않고 Docker Hub 에서 받는다.
x-app: &app
  image: leochoi224/gooddeedquest:latest
  env_file:
    - .env
  environment:
    REDIS_URL: redis://redis:6379/0
    AI_SERVICE_URL: http://ai:8001
    FONT_PATH: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    container_name: gdq-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *app
    container_name: gdq-backend
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  # ai 는 포트를 밖으로 열지 않는다. backend 가 컨테이너 안에서만 부른다.
  ai:
    <<: *app
    container_name: gdq-ai
    command: uvicorn ai.main:app --host 0.0.0.0 --port 8001

  celery-worker:
    <<: *app
    container_name: gdq-celery-worker
    command: >
      celery -A backend.app.challenge.celery_app:celery_app
      worker --loglevel=info --queues=maintenance

  celery-beat:
    <<: *app
    container_name: gdq-celery-beat
    command: >
      celery -A backend.app.challenge.celery_app:celery_app
      beat --loglevel=info

  celery-worker-shortform:
    <<: *app
    container_name: gdq-celery-shortform
    command: >
      celery -A backend.app.short_form.celery_app:celery_app
      worker --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    container_name: gdq-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    # 6시간마다 스스로 리로드한다. certbot 이 인증서를 갱신해도
    # nginx 는 그걸 모르기 때문에, 주기적으로 다시 읽게 해줘야 한다.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    container_name: gdq-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # 12시간마다 갱신을 시도한다. 만료 30일 전부터만 실제로 갱신되고
    # 그 전엔 아무것도 안 한다. nginx 리로드는 nginx 쪽 6시간 주기가 맡는다.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    restart: unless-stopped
