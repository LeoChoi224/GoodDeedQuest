name: ⚙️ Refactor
description: 코드 개선, 최적화 및 고도화를 위한 이슈입니다.
title: "[Refactor] "
labels:
  - refactor

body:
  - type: markdown
    attributes:
      value: |
        ## ⚙️ Refactor Issue

        코드 개선 및 최적화 작업을 위한 이슈입니다.

  - type: textarea
    id: overview
    attributes:
      label: 📌 작업 개요
      description: 리팩토링할 대상과 방향을 간단히 설명해주세요.
      placeholder: 예) 퀘스트 추천 에이전트들의 LLM 호출 구조를 LCEL 체이닝으로 교체합니다.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 🎯 작업 목적
      description: 리팩토링을 통해 얻는 이점(성능, 가독성, 예외 제어 등)을 적어주세요.
      placeholder: 예) SystemMessage와 HumanMessage의 명확한 격리를 통해 프롬프트 규칙 준수율을 향상시키기 위해
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업 목록
      description: 진행할 개선 작업을 체크리스트 형태로 작성해주세요.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🚀 예상 결과
      description: 작업 완료 후 코드의 상태나 기대 성능을 작성해주세요.
      placeholder: 예) 기존 테스트 코드가 모두 통과하며, 코드가 30% 이상 간결해진다.

  - type: input
    id: branch
    attributes:
      label: 🌿 브랜치명
      description: 생성할 브랜치명을 작성해주세요.
      placeholder: refactor/23-lcel-chaining

  - type: input
    id: pr
    attributes:
      label: 🔗 관련 PR
      description: PR 생성 후 연결해주세요.
      placeholder: Closes #23