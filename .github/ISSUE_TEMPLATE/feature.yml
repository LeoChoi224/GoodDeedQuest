name: 🚀 Feature
description: 새로운 기능 개발을 위한 이슈입니다.
title: "[Feat] "
labels:
  - feat

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Feature Issue

        새로운 기능 개발을 위한 이슈입니다.

  - type: textarea
    id: overview
    attributes:
      label: 📌 작업 개요
      description: 작업할 기능을 간단히 설명해주세요.
      placeholder: 예) AI 퀘스트 추천 API를 구현합니다.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 🎯 작업 목적
      description: 왜 이 기능이 필요한지 작성해주세요.
      placeholder: 사용자 맞춤형 퀘스트 추천 기능을 제공하기 위해
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업 목록
      description: 구현할 작업을 체크리스트 형태로 작성해주세요.
      value: |
        - [ ]
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 📋 참고 사항
      description: 관련 문서, API 명세서, ERD 등을 작성해주세요.
      placeholder: API 명세서, ERD, 디자인 링크 등

  - type: textarea
    id: expected
    attributes:
      label: 🚀 예상 결과
      description: 구현 완료 후 기대되는 결과를 작성해주세요.
      placeholder: AI 추천 API가 정상적으로 추천 결과를 반환한다.

  - type: input
    id: branch
    attributes:
      label: 🌿 브랜치명
      description: 생성할 브랜치명을 작성해주세요.
      placeholder: feat/23-ai-recommend

  - type: input
    id: pr
    attributes:
      label: 🔗 관련 PR
      description: PR 생성 후 연결해주세요.
      placeholder: Closes #23