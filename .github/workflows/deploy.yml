name: Deploy to EC2

on:
  push:
    branches: [main]
  # 수동 실행도 가능하게 해둔다. 배포만 다시 하고 싶을 때 쓴다.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # 러너가 amd64 라서 교차 빌드가 아니다. 맥에서 20분 걸리던 게 여기선 몇 분이면 끝난다.
      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gooddeedquest:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gooddeedquest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/gdq
            docker compose pull
            docker compose up -d
            docker image prune -f